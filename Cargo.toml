[package]
name = "workflow-map"
version = "0.1.0"
edition = "2021"
authors = ["4shil"]
description = "Terminal-native agentic workflow visualizer. Parse LangChain, CrewAI, DSPy, AutoGen, Hermes Agent configs and render interactive ASCII workflow maps."
license = "MIT"
repository = "https://github.com/4shil/workflow-map"
homepage = "https://github.com/4shil/workflow-map"
categories = ["command-line-utilities", "development-tools"]
keywords = ["workflow", "agent", "langchain", "crewai", "dspy", "tui", "ascii"]
rust-version = "1.75"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
notify = "7.0"
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
once_cell = "1.20"
unicode-width = "0.2"
dirs = "5.0"
ureq = { version = "2.10", features = ["tls"] }
copypasta = "0.10"

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
